<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="#090e17" stroke="url(#bgGrad)" stroke-width="3" />
  
  <!-- Subtle circular backdrop -->
  <circle cx="50" cy="50" r="32" fill="url(#bgGrad)" opacity="0.16" />

  <!-- Ecology Leaf & Sprout Vector -->
  <g filter="url(#glow)">
    <!-- Primary Leaf -->
    <path d="M50 20 C68 20 80 34 78 52 C76 68 62 76 50 80 C38 76 24 68 22 52 C20 34 32 20 50 20 Z" 
          fill="url(#bgGrad)" opacity="0.9" />
    <!-- Leaf Inner Center Spine -->
    <path d="M50 24 C50 45 50 65 50 76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <!-- Veins -->
    <path d="M50 38 Q60 32 66 34" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />
    <path d="M50 48 Q38 42 34 44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />
    <path d="M50 58 Q60 54 65 57" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />
    <path d="M50 66 Q40 64 36 67" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>
